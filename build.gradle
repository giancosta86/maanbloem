buildscript {
    repositories {
        maven {
            url 'https://dl.bintray.com/giancosta86/Hephaestus'
        }

        jcenter()
    }

    dependencies {
        classpath 'info.gianlucacosta.moonlicense:moonlicense-gradle:4.3'
        classpath 'info.gianlucacosta.moondeploy:moondeploy-gradle:3.3'
        classpath 'info.gianlucacosta.aurora:aurora:9.0'
    }
}


apply plugin: 'scala'
apply plugin: 'application'
apply plugin: 'info.gianlucacosta.moonlicense'
apply plugin: 'info.gianlucacosta.moondeploy'
apply plugin: 'info.gianlucacosta.aurora'


group 'info.gianlucacosta.maanbloem'
archivesBaseName = 'maanbloem'
version '2.3'


description = 'App manager for MoonDeploy'

ext.facebookPage = "https://www.facebook.com/MoonDeploy"


mainClassName = "info.gianlucacosta.maanbloem.App"


repositories {
    mavenCentral()
}


dependencies {
    generatedCompile 'org.scala-lang:scala-library:2.11.8'

    compile 'org.scala-lang:scala-library:2.11.8'

    compile 'javax.json:javax.json-api:1.0'
    compile 'org.glassfish:javax.json:1.0.4'

    compile 'org.jclarion:image4j:0.7'

    compile 'info.gianlucacosta.helios:helios-fx:5.0'
}


moonLicense {
    license = apache2

    productInfo {
        productName = 'MaanBloem'
        inceptionYear = 2016
        copyrightHolder = 'Gianluca Costa'
    }
}


aurora {
    gitHubUser = 'giancosta86'

    author {
        name = 'Gianluca Costa'
        email = 'gianluca@gianlucacosta.info'
        url = 'http://gianlucacosta.info/'
    }

    javaVersion {
        major = 1
        minor = 8
        build = 0
        update = 91
    }
}
